<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory | ByteForce Admin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body>
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="h1 mb-1">System User Directory</h1>
      <p>Audit registered platform users, search by name/email, and toggle active account status.</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-6">
    <div class="grid grid-cols-3 gap-4 md:grid-cols-1">
      <div class="form-group mb-0">
        <label for="userSearchInput" class="form-label">Search Name / Email</label>
        <input type="text" id="userSearchInput" class="form-control" placeholder="Search user name or email address...">
      </div>

      <div class="form-group mb-0">
        <label for="roleFilter" class="form-label">Filter by Role</label>
        <select id="roleFilter" class="form-control">
          <option value="">All Roles</option>
          <option value="JobSeeker">Job Seeker</option>
          <option value="Employer">Employer</option>
          <option value="Administrator">Administrator</option>
        </select>
      </div>

      <div class="form-group mb-0">
        <label for="statusFilter" class="form-label">Filter by Status</label>
        <select id="statusFilter" class="form-control">
          <option value="">All Statuses</option>
          <option value="true">Active Only</option>
          <option value="false">Disabled Only</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Email Address</th>
          <th>Role</th>
          <th>Registered Date</th>
          <th>Status</th>
          <th style="text-align: right;">Toggle Account</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="6" class="text-center py-4">Loading user directory...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/loader.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/admin/users.js"></script>
</body>
</html>
