<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacancy Audit | ByteForce Admin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body>
  <div class="mb-6">
    <h1 class="h1 mb-1">System-Wide Vacancies Audit</h1>
    <p>Monitor posted job vacancies and employer activity across the platform.</p>
  </div>

  <div class="card mb-6">
    <div class="form-group mb-0">
      <input type="text" id="adminVacancySearch" class="form-control" placeholder="Search vacancies by title or location...">
    </div>
  </div>

  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Vacancy Title</th>
          <th>Location</th>
          <th>Required Experience</th>
          <th>Required Skills</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="adminVacanciesTableBody">
        <tr><td colspan="5" class="text-center py-4">Loading system vacancies...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/loader.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/admin/vacancies.js"></script>
</body>
</html>
