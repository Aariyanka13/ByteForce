<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Seeker Registration | ByteForce</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/auth/login.css">
</head>
<body class="auth-page">
  <div class="auth-card card" style="max-width: 480px;">
    <div class="auth-header">
      <a href="/index.html" class="brand-logo justify-center mb-2">
        <div class="brand-icon"><img src="/images/logo-icon.svg" alt="ByteForce Logo" width="36" height="36"></div>
        <span>Byte<span style="color: var(--primary);">Force</span></span>
      </a>
      <h1 class="h2 mb-1">Create Candidate Account</h1>
      <p>Find your next career opportunity matched to your skills</p>
    </div>

    <div id="apiErrorBanner" class="badge badge-rejected w-full mb-4 hidden" style="padding: 10px; border-radius: var(--radius-md);"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="fullName" class="form-label">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
        <div class="invalid-feedback">Full name is required.</div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <div class="password-input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility"></button>
        </div>
        <div class="invalid-feedback">Password must be at least 6 characters.</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
        <div class="password-input-wrapper">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
          <button type="button" id="toggleConfirmPasswordBtn" class="password-toggle-btn" aria-label="Toggle confirm password visibility"></button>
        </div>
        <div class="invalid-feedback" id="confirmFeedback">Passwords must match.</div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg mt-4">
        <span id="btnText">Create Candidate Account</span>
        <span id="btnSpinner" class="hidden">Creating Account...</span>
      </button>
    </form>

    <div class="auth-footer mt-6 text-center">
      <p>Already have an account? <a href="/auth/login.html" class="link">Log In</a></p>
      <p class="mt-1" style="font-size: 0.8rem;">Are you an employer? <a href="/auth/register-employer.html" class="link">Register Employer</a></p>
    </div>
  </div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/validators.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/auth/register-jobseeker.js"></script>
</body>
</html>
