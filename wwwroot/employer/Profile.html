<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile | ByteForce</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body>
  <div class="mb-6">
    <h1 class="h1 mb-1">Company Profile</h1>
    <p>Manage public corporate information displayed on your vacancy listings.</p>
  </div>

  <div class="card" style="max-width: 720px;">
    <form id="employerProfileForm" novalidate>
      <div class="form-group">
        <label for="companyName" class="form-label">Company Name <span class="required">*</span></label>
        <input type="text" id="companyName" class="form-control" placeholder="Acme Software Corp" required>
        <div class="invalid-feedback">Company name is required.</div>
      </div>

      <div class="grid grid-cols-2 gap-4 md:grid-cols-1">
        <div class="form-group">
          <label for="industry" class="form-label">Industry <span class="required">*</span></label>
          <input type="text" id="industry" class="form-control" placeholder="Information Technology" required>
          <div class="invalid-feedback">Industry is required.</div>
        </div>

        <div class="form-group">
          <label for="location" class="form-label">Headquarters Location <span class="required">*</span></label>
          <input type="text" id="location" class="form-control" placeholder="New York, NY" required>
          <div class="invalid-feedback">Location is required.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="website" class="form-label">Website URL</label>
        <input type="url" id="website" class="form-control" placeholder="https://example.com">
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Company Description <span class="required">*</span></label>
        <textarea id="description" class="form-control" rows="5" placeholder="Provide a brief overview of your business, mission, and work culture..." required></textarea>
        <div class="invalid-feedback">Description is required.</div>
      </div>

      <div class="flex items-center justify-end gap-3 mt-6">
        <button type="submit" id="saveEmployerProfileBtn" class="btn btn-primary btn-lg">
          Save Company Profile
        </button>
      </div>
    </form>
  </div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/validators.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/employer/profile.js"></script>
</body>
</html>
