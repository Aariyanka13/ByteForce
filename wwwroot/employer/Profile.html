<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer Profile</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <main class="page-container">

        <header class="page-header">
            <span class="page-label">Employer Account</span>

            <h1>Employer Profile</h1>

            <p class="page-subtitle">
                Manage your company information used across job vacancies.
            </p>
        </header>

        <form id="employerProfileForm">

            <div class="form-heading">
                <div>
                    <h2>Company Information</h2>
                    <p>
                        Keep your company details accurate and up to date.
                    </p>
                </div>
            </div>

            <div class="form-group">
                <label for="companyName">
                    Company Name
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="companyName"
                       placeholder="Enter company name"
                       required>
            </div>

            <div class="form-group">
                <label for="industry">Industry</label>

                <input type="text"
                       id="industry"
                       placeholder="e.g. Information Technology">
            </div>

            <div class="form-group">
                <label for="location">Location</label>

                <input type="text"
                       id="location"
                       placeholder="e.g. Colombo">
            </div>

            <div class="form-group">
                <label for="website">Website</label>

                <input type="url"
                       id="website"
                       placeholder="https://www.company.com">
            </div>

            <div class="form-group">
                <label for="description">Company Description</label>

                <textarea id="description"
                          placeholder="Briefly describe your company..."></textarea>
            </div>

            <button type="submit">
                Save Profile
            </button>

        </form>

        <p id="message"></p>

    </main>

    <script src="profile.js"></script>

</body>
</html>
