<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacancy Applicants | ByteForce</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body>
  <div class="mb-4">
    <a href="/employer/vacancies.html" class="link text-sm">← Back to Vacancies</a>
  </div>

  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="h1 mb-1">Vacancy Applicant Evaluation</h1>
      <p id="vacancySubtitle">Evaluate candidate match scores and manage application statuses.</p>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Candidate Name</th>
          <th>Match Score</th>
          <th>Applied Date</th>
          <th>Current Status</th>
          <th style="text-align: right;">Update Status / Actions</th>
        </tr>
      </thead>
      <tbody id="applicantsTableBody">
        <tr><td colspan="5" class="text-center py-4">Loading applicants...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/loader.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/employer/applications.js"></script>
</body>
</html>
