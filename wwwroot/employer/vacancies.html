<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vacancy Management</title>
    <link rel="stylesheet" href="vacancies.css">
</head>

<body>

    <main>

        <header>
            <span>Employer Workspace</span>

            <h1>Vacancy Management</h1>

            <p>
                Create and manage job vacancies for your company.
            </p>
        </header>

        <section>
            <div>
                <h2>Create Vacancy</h2>
                <p>Enter the job requirements below.</p>
            </div>

            <form id="vacancyForm">

                <div>
                    <label for="title">
                        Job Title *
                    </label>

                    <input type="text"
                           id="title"
                           placeholder="e.g. ASP.NET Core Developer"
                           required>
                </div>

                <div>
                    <label for="description">
                        Job Description *
                    </label>

                    <textarea id="description"
                              placeholder="Describe the vacancy..."
                              required></textarea>
                </div>

                <div>
                    <label for="location">
                        Location
                    </label>

                    <input type="text"
                           id="location"
                           placeholder="e.g. Colombo">
                </div>

                <div>
                    <label for="requiredExperienceYears">
                        Required Experience (Years)
                    </label>

                    <input type="number"
                           id="requiredExperienceYears"
                           min="0"
                           max="50"
                           step="0.5"
                           value="0">
                </div>

                <div>
                    <label for="requiredEducationLevel">
                        Required Education Level
                    </label>

                    <select id="requiredEducationLevel">
                        <option value="0">No Requirement</option>
                        <option value="1">Certificate</option>
                        <option value="2">Diploma</option>
                        <option value="3">Bachelor</option>
                        <option value="4">Master</option>
                    </select>
                </div>

                <div>
                    <label>
                        Required Skills *
                    </label>

                    <div id="skillsContainer">
                        <p>Skills will be loaded here.</p>
                    </div>
                </div>

                <button type="submit">
                    Create Vacancy
                </button>

            </form>

            <p id="vacancyMessage"></p>
        </section>

        <section>
            <div>
                <h2>My Vacancies</h2>
                <p>View and manage your posted vacancies.</p>
            </div>

            <div id="vacancyList">
                <p>No vacancies loaded yet.</p>
            </div>
        </section>

    </main>
    <script src="vacancies.js"></script>

</body>
</html>
