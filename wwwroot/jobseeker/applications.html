<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications | ByteForce</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body>
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="h1 mb-1">My Submitted Applications</h1>
      <p>Monitor real-time evaluation status for your job applications.</p>
    </div>
    <div>
      <select id="statusFilter" class="form-control" style="width: 180px;">
        <option value="">All Statuses</option>
        <option value="Applied">Applied</option>
        <option value="UnderReview">Under Review</option>
        <option value="Shortlisted">Shortlisted</option>
        <option value="Selected">Selected</option>
        <option value="Rejected">Rejected</option>
      </select>
    </div>
  </div>

  <div class="table-wrapper mb-6">
    <table class="table">
      <thead>
        <tr>
          <th>Vacancy Title</th>
          <th>Company</th>
          <th>Applied Date</th>
          <th>Match Score</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="applicationsTableBody">
        <tr><td colspan="5" class="text-center py-4">Loading applications...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="paginationBar"></div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/loader.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/js/shared/pagination.js"></script>
  <script src="/jobseeker/applications.js"></script>
</body>
</html>
