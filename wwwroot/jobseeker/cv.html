<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Document | ByteForce</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <style>
    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      text-align: center;
      background-color: var(--surface);
      cursor: pointer;
      transition: all var(--transition-base);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }
  </style>
</head>
<body>
  <div class="mb-6">
    <h1 class="h1 mb-1">CV Document</h1>
    <p>Upload your resume in PDF or DOCX format (Max 5MB).</p>
  </div>

  <!-- Current CV Card -->
  <div class="card mb-6" id="currentCvCard">
    <div class="card-header">
      <div class="card-title">Uploaded CV Resume</div>
      <span class="badge badge-selected" id="cvStatusBadge">Active Document</span>
    </div>
    
    <div id="cvDetailsContent">
      <div class="skeleton" style="height: 48px; width: 100%;"></div>
    </div>
  </div>

  <!-- File Upload Form Zone -->
  <div class="card">
    <div class="card-header">
      <div class="card-title" id="uploadCardTitle">Upload New CV</div>
    </div>

    <form id="cvUploadForm">
      <div class="upload-zone mb-4" id="dropZone">
        <div class="text-primary mb-2">
          <svg class="icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <div class="font-semibold text-main mb-1">Click to browse or drag and drop your CV file</div>
        <div class="text-sm text-muted">Supported formats: .pdf, .docx (Max file size: 5MB)</div>
        <input type="file" id="cvFileInput" accept=".pdf,.docx" style="display: none;">
      </div>

      <div id="fileSelectedInfo" class="hidden mb-4 p-3 bg-surface-secondary border rounded flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span id="selectedFileName" class="font-semibold text-sm">resume.pdf</span>
          <span id="selectedFileSize" class="text-xs text-muted">(1.2 MB)</span>
        </div>
        <button type="button" id="clearFileBtn" class="btn btn-secondary btn-sm flex items-center gap-1 text-danger">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          <span>Remove</span>
        </button>
      </div>

      <button type="submit" id="uploadSubmitBtn" class="btn btn-primary btn-block btn-lg" disabled>
        <span>Upload Resume Document</span>
      </button>
    </form>
  </div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/jobseeker/cv.js"></script>
</body>
</html>
