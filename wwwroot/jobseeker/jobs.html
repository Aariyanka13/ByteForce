<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs | ByteForce</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <style>
    .job-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="mb-6">
    <h1 class="h1 mb-1">Browse Job Vacancies</h1>
    <p>Search open positions matched to your skills and experience score.</p>
  </div>

  <!-- Search & Filter Bar -->
  <div class="card mb-6">
    <form id="searchForm" class="grid grid-cols-4 gap-4 md:grid-cols-1">
      <div class="form-group mb-0">
        <label for="searchInput" class="form-label">Job Title / Keyword</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Developer, Engineer, C#...">
      </div>

      <div class="form-group mb-0">
        <label for="locationInput" class="form-label">Location</label>
        <input type="text" id="locationInput" class="form-control" placeholder="New York, Remote...">
      </div>

      <div class="form-group mb-0">
        <label for="expInput" class="form-label">Max Required Experience</label>
        <select id="expInput" class="form-control">
          <option value="">Any Experience</option>
          <option value="1">Up to 1 Year</option>
          <option value="3">Up to 3 Years</option>
          <option value="5">Up to 5 Years</option>
          <option value="10">Up to 10 Years</option>
        </select>
      </div>

      <div class="flex items-end">
        <button type="submit" class="btn btn-primary btn-block" style="height: 42px;">Filter Jobs</button>
      </div>
    </form>
  </div>

  <!-- Jobs Grid Container -->
  <div id="jobsGridContainer" class="grid grid-cols-2 gap-6 mb-6 md:grid-cols-1">
    <div class="skeleton" style="height: 180px;"></div>
    <div class="skeleton" style="height: 180px;"></div>
  </div>

  <!-- Pagination -->
  <div id="paginationBar"></div>

  <script src="/js/core/constants.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/guards.js"></script>
  <script src="/js/core/ui.js"></script>
  <script src="/js/core/navigation.js"></script>
  <script src="/js/shared/toast.js"></script>
  <script src="/js/shared/modal.js"></script>
  <script src="/js/shared/loader.js"></script>
  <script src="/js/shared/notifications.js"></script>
  <script src="/js/shared/pagination.js"></script>
  <script src="/jobseeker/jobs.js"></script>
</body>
</html>
